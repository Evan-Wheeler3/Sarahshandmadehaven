<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Felt Tower Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital@1&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #cdd6cf; overflow: hidden; }
  svg { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<svg id="s" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-label="Felt tower mockup"></svg>
<script>
/* Felt-and-stitch style mockup of the hero. Static: the real version keeps
   every shape and animation, only the way things are painted changes. */
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('s');
function el(n, a, p) { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); (p || svg).appendChild(e); return e; }
let seed = 11;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

svg.innerHTML = `
<defs>
  <!-- felt: fuzzy fibre edges, a matted fibre surface, a soft puffed edge and a shadow below -->
  <filter id="felt" x="-4%" y="-4%" width="108%" height="112%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="3" result="n1"/>
    <feDisplacementMap in="SourceGraphic" in2="n1" scale="3.2" xChannelSelector="R" yChannelSelector="G" result="fuzz"/>
    <feTurbulence type="fractalNoise" baseFrequency="1.15" numOctaves="3" seed="8" result="n2"/>
    <feDiffuseLighting in="n2" surfaceScale="1.1" lighting-color="#fff" result="bump"><feDistantLight azimuth="235" elevation="60"/></feDiffuseLighting>
    <feComponentTransfer in="bump" result="bumpSoft"><feFuncR type="linear" slope=".35" intercept=".68"/><feFuncG type="linear" slope=".35" intercept=".68"/><feFuncB type="linear" slope=".35" intercept=".68"/></feComponentTransfer>
    <feBlend in="fuzz" in2="bumpSoft" mode="multiply" result="tex0"/>
    <feComposite in="tex0" in2="fuzz" operator="in" result="tex"/>
    <feGaussianBlur in="SourceAlpha" stdDeviation="3.2" result="ab"/>
    <feOffset in="ab" dx="-1.5" dy="-2" result="abo"/>
    <feComposite in="SourceAlpha" in2="abo" operator="out" result="rim"/>
    <feFlood flood-color="#2a1a0c" flood-opacity=".38"/>
    <feComposite in2="rim" operator="in" result="rimShade"/>
    <feComposite in="rimShade" in2="fuzz" operator="in" result="rimIn"/>
    <feMerge result="puffed"><feMergeNode in="tex"/><feMergeNode in="rimIn"/></feMerge>
    <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="sb"/>
    <feOffset in="sb" dx="2" dy="3" result="so"/>
    <feFlood flood-color="#1f140a" flood-opacity=".35"/>
    <feComposite in2="so" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="puffed"/></feMerge>
  </filter>
  <!-- the same felt, without the puffed rim (big background sheets) -->
  <filter id="feltFlat" x="-2%" y="-2%" width="104%" height="104%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="5" result="n1"/>
    <feDisplacementMap in="SourceGraphic" in2="n1" scale="3" xChannelSelector="R" yChannelSelector="G" result="fuzz"/>
    <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="3" seed="2" result="n2"/>
    <feDiffuseLighting in="n2" surfaceScale="1" lighting-color="#fff" result="bump"><feDistantLight azimuth="235" elevation="62"/></feDiffuseLighting>
    <feComponentTransfer in="bump" result="bumpSoft"><feFuncR type="linear" slope=".3" intercept=".72"/><feFuncG type="linear" slope=".3" intercept=".72"/><feFuncB type="linear" slope=".3" intercept=".72"/></feComponentTransfer>
    <feBlend in="fuzz" in2="bumpSoft" mode="multiply" result="tex0"/>
    <feComposite in="tex0" in2="fuzz" operator="in" result="tex"/>
    <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="sb"/>
    <feOffset in="sb" dx="0" dy="-3" result="so"/>
    <feFlood flood-color="#1f140a" flood-opacity=".25"/>
    <feComposite in2="so" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="tex"/></feMerge>
  </filter>
  <!-- thread: a little wobble so stitches look sewn by hand -->
  <filter id="thread" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" xChannelSelector="R" yChannelSelector="G" result="d"/>
    <feDropShadow dx=".6" dy=".9" stdDeviation=".4" flood-color="#000" flood-opacity=".35"/>
  </filter>
  <linearGradient id="towerShade" x1="0" x2="1">
    <stop offset="0" stop-color="#2a1708" stop-opacity=".42"/><stop offset=".22" stop-color="#fff2d8" stop-opacity=".12"/>
    <stop offset=".45" stop-color="#2a1708" stop-opacity="0"/><stop offset="1" stop-color="#2a1708" stop-opacity=".55"/>
  </linearGradient>
  <radialGradient id="glow" cx=".5" cy=".85" r=".8"><stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#d0782f"/></radialGradient>
</defs>`;

const thread = (d, color, w = 2.2, dash = '7 5', parent) =>
  el('path', { d, fill: 'none', stroke: color, 'stroke-width': w, 'stroke-dasharray': dash, 'stroke-linecap': 'round', filter: 'url(#thread)' }, parent);

/* sky, sun, clouds */
el('rect', { x: -20, y: -20, width: 1480, height: 940, fill: '#d9e1d8', filter: 'url(#feltFlat)' });
const skyBand = el('g', { filter: 'url(#feltFlat)' });
el('path', { d: 'M-20 260 Q400 220 760 300 T1460 270 V940 H-20Z', fill: '#efe2c6' }, skyBand);
el('circle', { cx: 700, cy: 150, r: 70, fill: '#f8e7b5', filter: 'url(#felt)' });
thread('M700 88 a62 62 0 1 1 -0.1 0', '#e0b85e', 2, '6 6');
function cloud(x, y, s) {
  const g = el('g', { transform: `translate(${x} ${y}) scale(${s})` });
  const d = 'M0 40 C-6 14 26 4 40 18 C48 -6 92 -8 100 16 C116 2 150 10 146 38 C160 44 156 64 138 64 H6 C-12 64 -14 46 0 40Z';
  el('path', { d, fill: '#fbf8f1', filter: 'url(#felt)' }, g);
  thread('M10 56 H134 M14 44 C14 30 34 26 44 34 M56 24 C66 8 90 10 96 28', '#c9d3d6', 1.6, '5 5', g);
}
cloud(110, 110, 1.2); cloud(840, 230, 0.9); cloud(560, 60, 0.7);

/* hills */
const hills = [
  ['M-20 690 C200 610 420 650 640 620 S1100 560 1460 640 V940 H-20Z', '#a9b89c', '#8a9c7c'],
  ['M-20 760 C260 700 520 740 760 712 S1200 690 1460 730 V940 H-20Z', '#93a96f', '#7b915a'],
];
for (const [d, c, st] of hills) { el('path', { d, fill: c, filter: 'url(#felt)' }); }
thread('M-20 702 C200 622 420 662 640 632 S1100 572 1460 652', '#7e9070', 2, '8 6');
thread('M-20 772 C260 712 520 752 760 724 S1200 702 1460 742', '#6b8050', 2, '8 6');

/* the tower: a dark felt backing with felt stones stitched on */
const cx = 1150, tw = 138, tTop = 132, base = 830;
const hw = (y) => tw * (0.47 + 0.06 * (y - tTop) / (base - tTop));
const tower = el('g');
const bodyD = `M${cx - hw(tTop)} ${tTop} L${cx + hw(tTop)} ${tTop} L${cx + hw(base)} ${base} L${cx - hw(base)} ${base}Z`;
const pw = tw * 0.62, pTop = tTop - tw * 0.32, mh = tw * 0.3;
const n = 4, a = (2 * pw) / (n + (n - 1) * 0.75), gap = a * 0.75;
let parD = `M${cx - hw(tTop)} ${tTop + tw * 0.32} L${cx - pw} ${tTop + tw * 0.08} L${cx - pw} ${pTop - mh}`;
let x = cx - pw;
for (let i = 0; i < n; i++) { x += a; parD += ` L${x} ${pTop - mh}`; if (i < n - 1) { parD += ` L${x} ${pTop} L${x + gap} ${pTop} L${x + gap} ${pTop - mh}`; x += gap; } }
parD += ` L${cx + pw} ${tTop + tw * 0.08} L${cx + hw(tTop)} ${tTop + tw * 0.32}Z`;
el('path', { d: bodyD, fill: '#5d4129', filter: 'url(#felt)' }, tower);
el('path', { d: parD, fill: '#5d4129', filter: 'url(#felt)' }, tower);

const stoneCols = ['#e3bf87', '#d9ab6c', '#ecd3a2', '#d39a6a', '#c98f62', '#e8c48f', '#dcb57b', '#f0dcb4', '#cfa476'];
const stones = el('g', { filter: 'url(#felt)' }, tower);
const stitches = el('g', null, tower);
function stoneRow(y0, y1, xl, xr, inset = 4) {
  let xx = xl + 2;
  while (xx < xr - 8) {
    let w = 26 + rnd() * 32;
    if (xr - (xx + w) < 22) w = xr - xx - 2;
    const sx = xx + 2, sy = y0 + 2, sw = w - 4, sh = y1 - y0 - 4;
    const r = 6 + rnd() * 5;
    el('rect', { x: sx, y: sy, width: sw, height: sh, rx: r, fill: stoneCols[Math.floor(rnd() * stoneCols.length)] }, stones);
    if (sw > 14 && sh > 12) {
      el('rect', { x: sx + inset, y: sy + inset, width: sw - inset * 2, height: sh - inset * 2, rx: Math.max(2, r - 3),
        fill: 'none', stroke: rnd() < 0.5 ? '#fff4dc' : '#8a5a33', 'stroke-opacity': .75, 'stroke-width': 1.3,
        'stroke-dasharray': '4 3.5', filter: 'url(#thread)' }, stitches);
    }
    xx += w;
  }
}
// battlements
for (let i = 0, bx = cx - pw; i < n; i++, bx += a + gap) stoneRow(pTop - mh, pTop + 2, bx - 2, bx + a + 2, 3.5);
stoneRow(pTop, tTop + tw * 0.1, cx - pw + 2, cx + pw - 2);
// a stitched trim band where the parapet overhangs
el('path', { d: `M${cx - pw} ${tTop + tw * 0.08} L${cx + pw} ${tTop + tw * 0.08} L${cx + hw(tTop)} ${tTop + tw * 0.32} L${cx - hw(tTop)} ${tTop + tw * 0.32}Z`, fill: '#b98a5a', filter: 'url(#felt)' }, tower);
thread(`M${cx - pw + 10} ${tTop + tw * 0.15} L${cx + pw - 10} ${tTop + tw * 0.15}`, '#fff1d6', 1.6, '5 4', tower);
for (let y = tTop + tw * 0.34; y < base - 30; ) {
  const h = 26 + rnd() * 14, yb = Math.min(base, y + h);
  stoneRow(y, yb, cx - hw(y), cx + hw(y));
  y = yb + 1;
}
// round-tower light and shade over the stones
el('path', { d: bodyD, fill: 'url(#towerShade)' }, tower);

// stitched outline down both sides
thread(`M${cx - hw(tTop) + 4} ${tTop + 40} L${cx - hw(base) + 4} ${base}`, '#fff1d6', 2, '8 6');
thread(`M${cx + hw(tTop) - 4} ${tTop + 40} L${cx + hw(base) - 4} ${base}`, '#3b2614', 2, '8 6');

/* window: cream arch, dark opening, glowing felt patch */
const wx = cx, wTop = tTop + tw * 0.8, wW = tw * 0.42, wB = wTop + tw * 1.05;
const arch = (w, t, b) => `M${wx - w / 2} ${b} L${wx - w / 2} ${t + w / 2} A${w / 2} ${w / 2} 0 0 1 ${wx + w / 2} ${t + w / 2} L${wx + w / 2} ${b}Z`;
el('path', { d: arch(wW + 26, wTop - 13, wB + 4), fill: '#f2e4c4', filter: 'url(#felt)' }, tower);
el('path', { d: arch(wW, wTop, wB), fill: '#2e1c10', filter: 'url(#felt)' }, tower);
el('path', { d: arch(wW - 16, wTop + 22, wB - 6), fill: 'url(#glow)', filter: 'url(#felt)' }, tower);
thread(arch(wW + 14, wTop - 7, wB + 2).replace(/Z$/, ''), '#b48a52', 1.6, '5 4', tower);
el('rect', { x: wx - wW * 0.8, y: wB, width: wW * 1.6, height: 11, rx: 4, fill: '#e9d6ae', filter: 'url(#felt)' }, tower);
// felt sparkles drifting from the window
const starD = 'M0 -7 L2 -2 L7 0 L2 2 L0 7 L-2 2 L-7 0 L-2 -2Z';
for (const [sx, sy, r] of [[wx - 62, wTop + 40, 1.4], [wx - 98, wTop + 12, 1], [wx - 40, wTop + 92, 0.9], [wx - 130, wTop + 66, 0.8]]) {
  el('path', { d: starD, transform: `translate(${sx} ${sy}) scale(${r})`, fill: '#ffe7a8', filter: 'url(#felt)' }, tower);
}

/* arrow slit */
const sy0 = wB + tw * 0.9;
el('rect', { x: cx - 6, y: sy0, width: 12, height: 56, rx: 6, fill: '#2e1c10', filter: 'url(#felt)' }, tower);

/* door: felt planks with running-stitch seams */
const dW = tw * 0.42, dTop = base - tw * 0.78;
const door = el('g', null, tower);
el('path', { d: arch(dW + 22, dTop - 11, base + 10), fill: '#f2e4c4', filter: 'url(#felt)' }, door);
el('path', { d: arch(dW, dTop, base + 10), fill: '#7a4b2a', filter: 'url(#felt)' }, door);
for (let i = 1; i < 4; i++) thread(`M${wx - dW / 2 + dW * i / 4} ${dTop + 8} V${base}`, '#c99a68', 1.4, '4 4', door);
el('circle', { cx: wx + dW * 0.28, cy: dTop + dW * 0.9, r: 3.5, fill: '#d9b46a', filter: 'url(#felt)' }, door);

/* ivy climbing the tower: felt leaves with stitched veins, felt flowers with knotted centres */
const leafD = 'M0 0 C-3 -3 -9 -4 -10 -8 C-12 -12 -8 -14 -6 -13 C-10 -17 -9 -22 -5 -21 C-3 -24 -1 -26 0 -29 C1 -26 3 -24 5 -21 C9 -22 10 -17 6 -13 C8 -14 12 -12 10 -8 C9 -4 3 -3 0 0Z';
const ivy = el('g');
function vine(pts) {
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for (let i = 1; i < pts.length; i++) { const p = pts[i - 1], q = pts[i]; d += ` Q${p[0] + (q[0] - p[0]) * 0.2 + 10} ${(p[1] + q[1]) / 2} ${q[0]} ${q[1]}`; }
  el('path', { d, fill: 'none', stroke: '#4c5a28', 'stroke-width': 5, 'stroke-linecap': 'round', filter: 'url(#felt)' }, ivy);
  thread(d, '#7d8f45', 1.2, '4 4', ivy);
  return pts;
}
const greens = ['#4f8a38', '#5f9a43', '#447a31', '#6aa64c'];
function leaf(x, y, rot, s) {
  const g = el('g', { transform: `translate(${x} ${y}) rotate(${rot}) scale(${s})` }, ivy);
  el('path', { d: leafD, fill: greens[Math.floor(rnd() * greens.length)], filter: 'url(#felt)' }, g);
  thread('M0 -2 V-24 M0 -10 L-6 -15 M0 -10 L6 -15', '#d6e8b0', 0.9, '2.5 2', g);
}
function flower(x, y, s, col) {
  const g = el('g', { transform: `translate(${x} ${y}) scale(${s})` }, ivy);
  const petals = el('g', { filter: 'url(#felt)' }, g);
  for (let i = 0; i < 5; i++) el('ellipse', { cx: 0, cy: -6, rx: 4.6, ry: 6, transform: `rotate(${i * 72})`, fill: col }, petals);
  el('circle', { r: 3.4, fill: '#f0b43c', filter: 'url(#felt)' }, g);
  for (let i = 0; i < 5; i++) el('circle', { cx: Math.cos(i * 1.26) * 1.6, cy: Math.sin(i * 1.26) * 1.6, r: .8, fill: '#9a5d14' }, g);
}
const v1 = vine([[cx - 70, base + 10], [cx - 58, base - 70], [cx - 40, base - 140], [cx - 52, base - 210], [cx - 30, base - 280]]);
const v2 = vine([[cx + 64, base + 10], [cx + 50, base - 60], [cx + 58, base - 120]]);
[[cx - 64, base - 40, -50], [cx - 50, base - 95, 40], [cx - 44, base - 150, -40], [cx - 56, base - 190, 50], [cx - 42, base - 240, -30], [cx - 30, base - 285, 20],
 [cx + 58, base - 30, 40], [cx + 46, base - 80, -40], [cx + 60, base - 118, 30]].forEach(([lx, ly, r]) => leaf(lx, ly, r, 1.3 + rnd() * 0.4));
flower(cx - 34, base - 118, 1.25, '#f3b9c0'); flower(cx - 60, base - 232, 1.1, '#fbf5ea'); flower(cx + 40, base - 52, 1.15, '#c9b0ea');

/* ground: green felt with thread grass and little felt flowers */
el('path', { d: 'M-20 830 C300 800 700 840 1000 818 C1150 806 1300 822 1460 812 V940 H-20Z', fill: '#6f8a48', filter: 'url(#felt)' });
thread('M-20 842 C300 812 700 852 1000 830 C1150 818 1300 834 1460 824', '#a6bd6e', 2, '7 6');
for (let gx = 10; gx < 1440; gx += 18 + rnd() * 22) {
  const gy = 832 - 8 * Math.sin(gx / 140) + 6;
  thread(`M${gx} ${gy} l-3 -11 M${gx + 4} ${gy} l3 -13 M${gx + 8} ${gy} l1 -9`, '#3f5a24', 1.6, '0', null);
}
for (const [fx, fy, c] of [[240, 836, '#f3b9c0'], [520, 842, '#fbf5ea'], [880, 838, '#f8d66a'], [1330, 834, '#fbf5ea'], [990, 846, '#f3b9c0']]) flower(fx, fy, 0.9, c);

/* the title, as felt letters appliquéd onto the sky */
const title = el('g', { transform: 'translate(96 250)' });
const t1 = el('text', { x: 6, y: 0, 'font-family': 'IM Fell English', 'font-style': 'italic', 'font-size': 76, fill: '#a34f3c', filter: 'url(#felt)' }, title);
t1.textContent = "Sarah's";
const big = [['Handmade', 150], ['Haven', 292]];
for (const [word, y] of big) {
  const t = el('text', { x: 0, y, 'font-family': 'IM Fell English', 'font-size': 150, fill: '#4a2f1e', filter: 'url(#felt)' }, title);
  t.textContent = word;
}
const tag = el('text', { x: 4, y: 372, 'font-family': 'EB Garamond', 'font-style': 'italic', 'font-size': 28, fill: '#5c4838' }, title);
tag.textContent = 'Fabric book covers, sewn by hand one at a time.';
// a felt button for the call to action
const btn = el('g', { transform: 'translate(100 660)' });
el('rect', { width: 300, height: 66, rx: 18, fill: '#a4523f', filter: 'url(#felt)' }, btn);
el('rect', { x: 8, y: 8, width: 284, height: 50, rx: 12, fill: 'none', stroke: '#ffe7d2', 'stroke-width': 1.8, 'stroke-dasharray': '6 5', filter: 'url(#thread)' }, btn);
const bt = el('text', { x: 150, y: 42, 'text-anchor': 'middle', 'font-family': 'EB Garamond', 'font-size': 23, 'font-weight': 600, fill: '#fff4e6' }, btn);
bt.textContent = 'See the book covers';
</script>
</body>
</html>
